<!doctype html>
<html lang="nl">
<head>

<title>Sprout &amp; Sword (testlab)</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#120c08;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
/* Houten pixel-panelen voor teksten en menu's */
.wood{background:#f8d8a0;color:#4a240c;border:4px solid #7c4820;box-shadow:0 0 0 3px #3a1e0c,inset 0 0 0 3px #e8c088,0 6px 0 3px rgba(0,0,0,.35);border-radius:4px;font:700 16px/1.35 ui-rounded,"Trebuchet MS",system-ui,sans-serif}
#toasts{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 40px);width:min(92vw,560px);transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;z-index:5}
.toast{padding:7px 14px;animation:tin .2s ease-out,tout .4s ease-in 2.4s forwards;max-width:100%;text-align:center;line-height:1.3}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
#dlg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,6,2,.45);z-index:8}
#dlg.on{display:flex}
#dlg .wood{padding:16px 20px;max-width:min(420px,calc(100vw - 40px));text-align:center}
#dlg h2{margin:0 0 8px;font-size:22px}
#dlg p{margin:6px 0}
#dlg .row{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.btn{font:700 16px ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:#4a240c;background:#ffe39a;border:3px solid #7c4820;border-radius:4px;box-shadow:0 3px 0 #3a1e0c;padding:8px 16px;cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3a1e0c}
.btn.plain{background:#f8d8a0}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.shop{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px;text-align:left}
.srow{display:grid;grid-template-columns:32px 1fr auto;grid-template-areas:"ic info qty" "ic info price";align-items:center;gap:2px 10px;background:#fbe6b8;border:2px solid #c49a5a;border-radius:4px;padding:6px 8px}
.srow img{grid-area:ic;width:30px;height:30px;image-rendering:pixelated}
.srow .sinfo{grid-area:info;line-height:1.2}.srow small{display:block;font-weight:600;font-size:12.5px;opacity:.8}
.srow .sprice{grid-area:price;justify-self:end;font-size:14px}
.srow .qty{grid-area:qty;display:flex;align-items:center;gap:6px}
.srow .qty span{min-width:22px;text-align:center}
.talk{display:flex;gap:12px;align-items:flex-start;text-align:left;margin-top:4px}
.talk img{width:64px;height:64px;image-rendering:pixelated;border:3px solid #7c4820;border-radius:4px;background:#cfe6f6;flex:none}
.talk .who{font-weight:800}.talk .hearts{font-size:13px;letter-spacing:1px}
.talk p{margin:4px 0 0}
.quest{background:#fbe6b8;border:2px solid #c49a5a;border-radius:4px;padding:6px 10px;margin-top:8px;text-align:left;font-size:14px}
.qb{padding:0 10px;font-size:20px;line-height:26px;box-shadow:0 2px 0 #3a1e0c}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:7}
#fade.on{opacity:1}
/* Aanraakbediening (alleen op telefoon/tablet) */
#joy{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);width:116px;height:116px;border-radius:50%;background:rgba(248,216,160,.28);border:4px solid rgba(124,72,32,.85);display:none;z-index:4;touch-action:none}
#joy i{position:absolute;left:30px;top:30px;width:48px;height:48px;border-radius:50%;background:#f8d8a0;border:4px solid #7c4820;box-shadow:0 3px 0 #3a1e0c}
#act{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);width:84px;height:84px;border-radius:50%;background:#ffe39a;border:4px solid #7c4820;box-shadow:0 4px 0 #3a1e0c;display:none;z-index:4;font:800 15px ui-rounded,system-ui,sans-serif;color:#4a240c;touch-action:none}
body.touch #act,body.touch.joy #joy{display:block}
#optBtn{position:fixed;left:calc(50% + 50px);top:max(8px,env(safe-area-inset-top));z-index:6;font:700 12px system-ui;background:rgba(40,20,8,.75);color:#ffe39a;border:2px solid #7c4820;border-radius:4px;padding:4px 8px;cursor:pointer}
#dbgBtn{position:fixed;left:50%;transform:translateX(-50%);top:max(8px,env(safe-area-inset-top));z-index:6;font:700 12px system-ui;background:rgba(40,20,8,.75);color:#ffe39a;border:2px solid #7c4820;border-radius:4px;padding:4px 8px;cursor:pointer}
#dbg{position:fixed;left:50%;transform:translateX(-50%);top:44px;z-index:6;display:none;flex-direction:column;gap:6px;padding:10px}
#dbg.on{display:flex}
#dbg .btn{font-size:13px;padding:5px 10px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ffe39a;font:700 18px system-ui;z-index:9;background:#120c08}
</style>

<body>
<canvas id="c"></canvas>
<div id="toasts"></div>
<div id="fade"></div>
<div id="dlg"><div class="wood" id="dlgBox"></div></div>
<div id="joy"><i></i></div>
<button id="act" aria-label="Gebruik">Doe</button>

<div id="dbg" class="wood">
  <b>Testlab</b>
  <button class="btn" data-d="town">Naar Mossbrook</button>
  <button class="btn" data-d="morning">Naar 09:00</button>
  <button class="btn" data-d="night">Naar 22:00</button>
  <button class="btn" data-d="grow">Alles 1 dag laten groeien</button>
  <button class="btn" data-d="ripe">Alles meteen rijp</button>
  <button class="btn" data-d="coins">+100 munten</button>
  <button class="btn" data-d="seeds">+10 van elk zaad</button>

  <button class="btn plain" data-d="reset">Test-save wissen</button>
</div>
<div id="load">Boerderij wordt getekend…</div>
<script>
'use strict';
/* =====================================================================
   Sprout & Sword – testlab v0.1 (alleen voor beheer)
   Alles (tegels, sprites, letters) wordt hier in code getekend als pixel art.
   Secties: kunst · wereld · invoer · speler · gereedschap · gewassen · tijd · HUD · opslag · test
   ===================================================================== */
const $=s=>document.querySelector(s);
const TILE=16;let MW=40,MH=30,WPX=MW*TILE,WPY=MH*TILE;   // maten van de wereld waar je nu bent (boerderij of dorp)
const SAVE='sproutsword.dev.v1';
const TOUCH=matchMedia('(pointer:coarse)').matches;if(TOUCH)document.body.classList.add('touch');

/* ---------------- kunst: paletten en tekenhulpjes ---------------- */
let seed=20261014;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};const pick=a=>a[Math.floor(rnd()*a.length)];
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const G=['#24521f','#2f6a2a','#3f862e','#56a23a','#73bd42','#97d351','#c4ea6c'];
const D=['#5e3418','#7a4622','#96602e','#b07a3c','#c9944c','#dfb064'];
const SA=['#9a6a32','#b98540','#d1a052','#e4b866','#f2d080','#fbe6a4'];
const T=['#3a200e','#4e2c14','#653a1c','#7c4a24','#93602e'];
const TW=['#22130a','#2e1a0e','#3e2414','#50301a','#644022'];
const WD=['#3a1e0c','#5a3214','#7c4820','#9e6230','#c08044','#dea060'];
const RF=['#3a1414','#5e1e1c','#842a22','#a83c2a','#c8583a','#e27a4c'];
const LFT=['#0f2a18','#1f4a2c','#2a6a3a','#3a8a44','#55a84c','#7cc45a','#a8dc72'];
const LF=['#0f2a18','#18402a','#22583a','#2f7244','#43904c','#62ad54','#8ccb64'];
const ST=['#2e2e36','#4a4a56','#686874','#8a8a96','#b0b0ba','#d4d4dc'];
const WA=['#163e6a','#1f5288','#2a68a6','#3c86c4','#68aee0','#a8d8f6','#e6f6ff'];
const OL='#173612';
let CX=null;
const P=(x,y,c)=>{CX.fillStyle=c;CX.fillRect(x|0,y|0,1,1);};
const R=(x,y,w,h,c)=>{CX.fillStyle=c;CX.fillRect(x|0,y|0,w|0,h|0);};
function disc(cx,cy,r,c){for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r*.5)P(cx+x,cy+y,c);}
function ell(cx,cy,rx,ry,c){for(let y=-ry;y<=ry;y++)for(let x=-rx;x<=rx;x++)if((x*x)/(rx*rx||1)+(y*y)/(ry*ry||1)<=1)P(cx+x,cy+y,c);}
// Sprite in een eigen canvasje, met een rand in de kleur van het materiaal (zoals echte pixel art)
function sprite(w,h,draw,outline){const c=document.createElement('canvas');c.width=w+2;c.height=h+2;const g=c.getContext('2d');const prev=CX;CX=g;g.translate(1,1);draw();CX=prev;
  if(outline){const d=g.getImageData(0,0,w+2,h+2),a=d.data,o=new Uint8Array((w+2)*(h+2));for(let i=0;i<o.length;i++)o[i]=a[i*4+3]>0;const oc=hex(outline);
    for(let y=0;y<h+2;y++)for(let x=0;x<w+2;x++){const i=y*(w+2)+x;if(o[i])continue;if((x>0&&o[i-1])||(x<w+1&&o[i+1])||(y>0&&o[i-w-2])||(y<h+1&&o[i+w+2])){a[i*4]=oc[0];a[i*4+1]=oc[1];a[i*4+2]=oc[2];a[i*4+3]=255;}}
    g.putImageData(d,0,0);}
  return c;}
function flip(s){const c=document.createElement('canvas');c.width=s.width;c.height=s.height;const g=c.getContext('2d');g.scale(-1,1);g.drawImage(s,-s.width,0);return c;}
const shadowCache={};
function shadowSpr(rx,ry){const k=rx+'x'+ry;if(!shadowCache[k])shadowCache[k]=sprite(rx*2+1,ry*2+1,()=>ell(rx,ry,rx,ry,'#16280c'),null);return shadowCache[k];}

/* ---------------- ruis ---------------- */
const PERM=[];for(let i=0;i<512;i++)PERM.push(rnd());
const hsh=(x,y)=>PERM[(((x*73856093)^(y*19349663))>>>0)%512];
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const s=t=>t*t*(3-2*t);
  const a=hsh(xi,yi),b=hsh(xi+1,yi),c=hsh(xi,yi+1),d=hsh(xi+1,yi+1);return a+(b-a)*s(xf)+(c-a)*s(yf)+(a-b-c+d)*s(xf)*s(yf);}
const fbm=(x,y)=>vnoise(x,y)*.6+vnoise(x*2.1+7,y*2.1+3)*.3+vnoise(x*4.3+1,y*4.3+9)*.1;

/* ---------------- wereld: indeling van de boerderij ---------------- */
const HOUSE={x:56,y:24};                       // linksboven van het huis-sprite
const DOOR={x0:114,x1:128,y:134};              // deuropening (voeten van de speler)
const FIELD={tx0:16,ty0:7,tx1:27,ty1:16};      // akker: 12 × 10 tegels
const FPX={x0:FIELD.tx0*16,y0:FIELD.ty0*16,x1:(FIELD.tx1+1)*16,y1:(FIELD.ty1+1)*16};
const POND={x:70,y:404,r:58};
const PATH=[[121,136],[121,190],[134,288],[170,312],[300,318],[660,320]];
const BIN={x:198,y:106,tx:[12,13],ty:7};      // verzendkist (tegels 12–13, rij 7)
function distSeg(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];const t=Math.max(0,Math.min(1,((px-a[0])*dx+(py-a[1])*dy)/(dx*dx+dy*dy)));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy);}
function cls(x,y){
  const n=fbm(x/18,y/18);
  const pd=Math.hypot(x-POND.x,(y-POND.y)*1.15)+(n-.5)*16;if(pd<POND.r)return 'water';if(pd<POND.r+6)return 'shore';
  let dp=1e9;for(let i=0;i<PATH.length-1;i++)dp=Math.min(dp,distSeg(x,y,PATH[i],PATH[i+1]));if(dp<9+(fbm(x/9,y/9)-.5)*7)return 'path';
  const ex=Math.max(FPX.x0-x,x-FPX.x1,0),ey=Math.max(FPX.y0-y,y-FPX.y1,0);if(Math.hypot(ex,ey)<6+(n-.3)*14)return 'dirt';
  if(fbm(x/22+40,y/22)>.8)return 'dirt';
  return 'grass';}
let MAP=null;   // klasse per pixel (voor water-tegels)
function buildGround(cls,wshade){
  const c=document.createElement('canvas');c.width=WPX;c.height=WPY;const g=c.getContext('2d');const img=g.createImageData(WPX,WPY);const px=img.data;
  const C=new Array(WPY);for(let y=0;y<WPY;y++){C[y]=new Array(WPX);for(let x=0;x<WPX;x++)C[y][x]=cls(x,y);}
  const set=(x,y,h)=>{if(x<0||y<0||x>=WPX||y>=WPY)return;const v=hex(h),i=(y*WPX+x)*4;px[i]=v[0];px[i+1]=v[1];px[i+2]=v[2];px[i+3]=255;};
  const gIdx=new Uint8Array(WPX*WPY);
  for(let y=0;y<WPY;y++)for(let x=0;x<WPX;x++){const k=C[y][x];const r=rnd();
    if(k==='grass'){const N=fbm(x/34,y/34),m=fbm(x/9+11,y/9+5);let i=N>.62?4:N<.36?2:3;if(m>.68)i++;if(m<.3)i--;if(r<.06)i++;else if(r<.12)i--;i=Math.max(1,Math.min(5,i));gIdx[y*WPX+x]=i;set(x,y,G[i]);}
    else if(k==='dirt'){let i=3;const m=fbm(x/7,y/7);if(m<.4)i=2;if(m>.66)i=4;if(r<.08)i--;else if(r<.13)i++;set(x,y,D[i]);}
    else if(k==='path'||k==='bridge'){let i=3;const m=fbm(x/6+3,y/6);if(m<.38)i=2;if(m>.66)i=4;if(r<.07)i--;else if(r<.12)i++;set(x,y,SA[i]);}
    else if(k==='shore'){set(x,y,r<.3?SA[2]:SA[1]);}
    else if(k==='cobble'){const off=(Math.floor(y/5)%2)*3,bx=Math.floor((x+off)/6),by=Math.floor(y/5),edge=(x+off)%6===0||y%5===0,v=hsh(bx,by);set(x,y,edge?ST[1]:v<.3?ST[2]:v<.75?ST[3]:'#9a9aa6');if(!edge&&(x+off)%6===1&&y%5===1)set(x,y,ST[4]);}
    else set(x,y,WA[wshade(x,y)]);}
  for(let n=0;n<26000;n++){const x=Math.floor(rnd()*WPX),y=Math.floor(rnd()*WPY);if(C[y][x]!=='grass')continue;const i=gIdx[y*WPX+x];
    const h=1+Math.floor(rnd()*3);for(let k=0;k<h;k++)if(y-k>=0&&C[y-k][x]==='grass')set(x,y-k,G[Math.max(0,i-1)]);if(y-h>=0&&C[y-h][x]==='grass')set(x,y-h,G[Math.min(6,i+1)]);
    if(rnd()<.25&&x+1<WPX&&y>2&&C[y][x+1]==='grass'){set(x+1,y-1,G[Math.max(0,i-1)]);set(x+1,y-2,G[Math.min(6,i+2)]);}}
  for(let y=1;y<WPY-1;y++)for(let x=1;x<WPX-1;x++){const k=C[y][x];
    if(k!=='grass'&&k!=='water'){const sand=k==='path'||k==='shore'||k==='bridge',e0=sand?SA[0]:k==='cobble'?ST[0]:D[0],e1=sand?SA[1]:k==='cobble'?ST[1]:D[1];if(C[y-1][x]==='grass')set(x,y,e0);else if(y>1&&C[y-2][x]==='grass')set(x,y,e1);
      if(C[y][x-1]==='grass'||C[y][x+1]==='grass')set(x,y,e1);}
    if(k==='grass'&&C[y+1][x]!=='grass'&&C[y+1][x]!=='water'){set(x,y,G[5]);if(rnd()<.4)set(x,y+1,G[4]);}
    if(k==='grass'&&(C[y][x-1]!=='grass'||C[y][x+1]!=='grass')&&C[y][x-1]!=='water'&&C[y][x+1]!=='water')set(x,y,G[1]);
    if(k==='water'){const nb=[C[y-1][x],C[y+1][x],C[y][x-1],C[y][x+1]];if(nb.some(v=>v!=='water'))set(x,y,rnd()<.5?WA[5]:WA[4]);else if(y>1&&C[y-2][x]!=='water')set(x,y,WA[1]);}
    if(k==='shore'&&[C[y-1][x],C[y+1][x],C[y][x-1],C[y][x+1]].includes('water'))set(x,y,'#8a6a3a');}
  for(let n=0;n<1600;n++){const x=Math.floor(rnd()*(WPX-3)),y=Math.floor(rnd()*(WPY-3));const k=C[y][x];
    if((k==='path'||k==='dirt')&&C[y+1][x+2]===k){const gg=rnd()<.5;set(x,y,ST[gg?3:2]);set(x+1,y,ST[2]);set(x,y+1,ST[1]);set(x+1,y+1,ST[1]);set(x,y,ST[4]);}
    if(k==='water'&&C[y][x+5]==='water'&&rnd()<.6){const l=2+Math.floor(rnd()*5);for(let i=0;i<l;i++)set(x+i,y,i===0||i===l-1?WA[4]:WA[5]);}}
  g.putImageData(img,0,0);return {c,C};}
const isWaterTile=(tx,ty)=>{if(!MAP||tx<0||ty<0||tx>=MW||ty>=MH)return false;return MAP[ty*16+8][tx*16+8]==='water';};
const inField=(tx,ty)=>tx>=FIELD.tx0&&tx<=FIELD.tx1&&ty>=FIELD.ty0&&ty<=FIELD.ty1;

/* ---------------- wereld: indeling van het dorp Mossbrook ---------------- */
const TOWN={mw:32,mh:22};
const SHOP={x:200,y:36};                       // Pip's Zaden (sprite 120 × 110)
const SDOOR={x0:256,x1:272,y:146};             // winkeldeur
const COTS=[{x:36,y:46,roof:'blue'},{x:344,y:50,roof:'green'}];   // huisjes (88 × 92), nog dicht
const TPATHS=[[[-10,220],[120,222],[200,208]],[[330,212],[440,222],[530,222]],[[80,138],[104,190],[196,206]],[[388,142],[374,192],[334,210]]];
const STREAM_X=y=>470+Math.sin(y/37)*6;
const BRIDGE={y0:206,y1:236};
function tcls(x,y){const n=fbm(x/18+60,y/18);
  const sd=Math.abs(x-STREAM_X(y))+(n-.5)*5;
  if(y>=BRIDGE.y0&&y<=BRIDGE.y1&&sd<18)return 'bridge';
  if(sd<9)return 'water';if(sd<13)return 'shore';
  if(Math.hypot((x-264)/82,(y-198)/52)<1+(fbm(x/8,y/8)-.5)*.1)return 'cobble';
  let dp=1e9;for(const L of TPATHS)for(let i=0;i<L.length-1;i++)dp=Math.min(dp,distSeg(x,y,L[i],L[i+1]));if(dp<9+(fbm(x/9+5,y/9)-.5)*7)return 'path';
  if(fbm(x/22+80,y/22)>.84)return 'dirt';
  return 'grass';}

/* ---------------- kunst: objecten ---------------- */
function canopy(cx,cy,rx,ry,n,pal,blossom){const cl=[];for(let i=0;i<n;i++){const a=rnd()*Math.PI*2,d=Math.sqrt(rnd());cl.push([cx+Math.cos(a)*rx*d,cy+Math.sin(a)*ry*d,3+Math.floor(rnd()*3)]);}
  cl.sort((a,b)=>a[1]-b[1]);
  for(const[x,y,r]of cl){for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){if(i*i+j*j>r*r+r*.6)continue;const s=i+j;let c=pal[2];if(s<-r*.2)c=pal[3];if(s<-r*.9)c=pal[4];if(s>r*.8)c=pal[1];P(x+i,y+j,c);}
    P(x-r+1,y-r+2,pal[5]);P(x-r+2,y-r+1,pal[5]);if(rnd()<.5)P(x-1,y-r,pal[6]);}

    if(wx>28&&wx<148&&wy>14&&wy<86){if(nearCounter())return openShop();step=null;auto={path:[{x:Math.max(44,Math.min(132,wx)),y:92}],face:3,t:0,noUse:1,then:openShop};return;}
    if(wy>RM.h-14&&wx>RM.ex0-4&&wx<RM.ex1+4){step=null;auto={path:[{x:88,y:RM.h-6},{x:88,y:RM.h+4}],t:0,noUse:1};return;}
    tapMark={x:wx,y:wy,t:0};step=null;auto={path:[{x:Math.max(12,Math.min(RM.w-12,wx)),y:Math.max(90,Math.min(RM.h-6,wy+6))}],t:0,noUse:1};return;}
  if(S.scene==='town'){const tx=Math.floor(wx/16),ty=Math.floor(wy/16);
    if(J.on&&wx>J.x-10&&wx<J.x+10&&wy>J.y-30&&wy<J.y+4)return goJuno();   // tik op Juno
    if((marbleVisible()&&tx===MARBLE[0]&&ty===MARBLE[1])||(bedsActive()&&BEDS.some(b=>b[0]===tx&&b[1]===ty))||(TOOLS[S.tool]==='can'&&isWaterTile(tx,ty)))return goUse(tx,ty);
    if(wx>332&&wx<364&&wy>148&&wy<182)return questText();   // prikbord
    if(inShopRect(wx,wy))return shopOpen()?goShopDoor():toast("Pip's Zaden is open van 08:00 tot 18:00");
    for(const c of COTS)if(wx>c.x&&wx<c.x+88&&wy>c.y&&wy<c.y+92)return toast('Hier wonen dorpsgenoten. Die leer je later kennen!');
    if(tx<=2&&ty>=12&&ty<=14)return goEdge(2,ty,14);
    if(walkable(tx,ty)){tapMark={x:tx*16+8,y:ty*16+12,t:0};if(!walkTo(tx,ty))toast('Daar kun je niet bij');return;}
    return toast('Daar kun je niet bij');}
  if(S.scene==='house'){   // binnen: open kamer, gewoon rechtstreeks lopen
    if(wx>110&&wx<158&&wy>20&&wy<86){if(nearBed())return askSleep();step=null;auto={path:[{x:134,y:92}],face:3,t:0,noUse:1,then:askSleep};return;}
    if(wy>ROOM.h-14&&wx>60&&wx<100){step=null;auto={path:[{x:80,y:ROOM.h-6},{x:80,y:ROOM.h+4}],t:0,noUse:1};return;}
    tapMark={x:wx,y:wy,t:0};step=null;auto={path:[{x:Math.max(12,Math.min(ROOM.w-12,wx)),y:Math.max(50,Math.min(ROOM.h-6,wy+6))}],t:0,noUse:1};return;}
  const tx=Math.floor(wx/16),ty=Math.floor(wy/16),[ptx,pty]=tileOf(S.px,S.py);
  if(tx===ptx&&ty===pty){if(step||auto||player.swing>0)return;S.dir=0;return useToolAt(tx,ty);}   // de tegel waar je op staat
  if(isWorkTarget(tx,ty))return goUse(tx,ty);
  if(tx>=37&&ty>=17&&ty<=20)return goEdge(37,ty,WPX-14);
  if(inHouseRect(wx,wy)||(tx===7&&ty===8))return goHouseDoor();
  if(walkable(tx,ty)){tapMark={x:tx*16+8,y:ty*16+12,t:0};if(!walkTo(tx,ty))toast('Daar kun je niet bij');return;}
  toast('Daar kun je niet bij');}
function addSwipeTile(wx,wy){const tx=Math.floor(wx/16),ty=Math.floor(wy/16),k=tx+','+ty;
  if(swipeSeen.has(k)||swipeQ.length>=30||!isWorkTarget(tx,ty)||isWaterTile(tx,ty))return;swipeSeen.add(k);swipeQ.push([tx,ty]);}
function swipeLine(a,b){const [x0,y0]=toWorld(...a),[x1,y1]=toWorld(...b),n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/4));
  for(let i=0;i<=n;i++)addSwipeTile(x0+(x1-x0)*i/n,y0+(y1-y0)*i/n);}
cv.addEventListener('pointerdown',e=>{if(dlgOpen)return;const x=e.clientX/SCALE,y=e.clientY/SCALE;
  for(const sl of slotRects)if(x>=sl.x&&x<sl.x+sl.w&&y>=sl.y&&y<sl.y+sl.h){if(S.tool===sl.i&&sl.i===3)cycleSeed();S.tool=sl.i;return;}
  if(questRect&&x>=questRect.x&&x<questRect.x+questRect.w&&y>=questRect.y&&y<questRect.y+questRect.h)return questText();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  swipeQ.length=0;swipeSeen.clear();
  const [wx,wy]=toWorld(e.clientX,e.clientY),tx=Math.floor(wx/16),ty=Math.floor(wy/16);
  const canSwipe=S.scene==='farm'&&['hoe','can','seed','hand'].includes(TOOLS[S.tool])&&inField(tx,ty);
  gest={id:e.pointerId,sx:e.clientX,sy:e.clientY,cx:e.clientX,cy:e.clientY,t:performance.now(),mode:'press',canSwipe,last:[e.clientX,e.clientY]};});
cv.addEventListener('pointermove',e=>{if(!gest||e.pointerId!==gest.id)return;gest.cx=e.clientX;gest.cy=e.clientY;
  const moved=Math.hypot(e.clientX-gest.sx,e.clientY-gest.sy);
  if(gest.mode==='press'&&moved>=10){if(gest.canSwipe){gest.mode='swipe';step=null;auto=null;swipeLine([gest.sx,gest.sy],[gest.sx,gest.sy]);}else{gest.mode='follow';step=null;auto=null;}}
  if(gest.mode==='swipe'){swipeLine(gest.last,[e.clientX,e.clientY]);gest.last=[e.clientX,e.clientY];}});
function endGesture(e,cancel){if(!gest||e.pointerId!==gest.id)return;const g=gest;gest=null;
  if(!cancel&&g.mode==='press')tapAt(g.sx,g.sy);}
cv.addEventListener('pointerup',e=>endGesture(e,false));
cv.addEventListener('pointercancel',e=>endGesture(e,true));
// lang vasthouden zonder te bewegen = meelopen met je vinger
function gestureTick(){if(gest&&gest.mode==='press'&&performance.now()-gest.t>=250&&!dlgOpen){gest.mode='follow';step=null;auto=null;}
  // veeg-rij afwerken, tegel voor tegel
  if(swipeQ.length&&!step&&!auto&&player.swing<=0&&!dlgOpen&&S.scene==='farm'&&!(gest&&gest.mode==='follow')){const [tx,ty]=swipeQ.shift();goUse(tx,ty);}}
// instellingen
function applyOpt(){document.body.classList.toggle('joy',!!S.opt.joy);if(!S.opt.joy)joyReset();}
function setJoy(on){S.opt.joy=on;applyOpt();save();toast(on?'Joystick staat aan':'Joystick staat uit: tik om te lopen');}
$('#optBtn').onclick=()=>dialog(`<h2>⚙️ Instellingen</h2><p>Op de telefoon tik je om te lopen en te werken, houd je je vinger vast om mee te lopen en veeg je over de akker om een hele rij te doen.</p><p>Joystick: <b>${S.opt.joy?'aan':'uit'}</b></p>`,
  [{t:S.opt.joy?'Joystick uitzetten':'Joystick aanzetten',fn:()=>setJoy(!S.opt.joy)},{t:'Sluiten',plain:1}]);
applyOpt();

/* ---------------- speler en botsingen ---------------- */
const player={get x(){return S.px;},get y(){return S.py;},anim:0,moving:false,swing:0};
const DIRV=[[0,1],[-1,0],[1,0],[0,-1]];
function solidAt(x,y){ // voeten op wereldpositie (x,y)?
  if(isRoom()){const RM=ROOMS[S.scene];if(x<6||x>RM.w-6||y<46||y>RM.h-2)return !(y>RM.h-2&&x>RM.ex0&&x<RM.ex1);
    for(const r of RM.solids)if(x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h)return true;return false;}
  if(x<8||x>WPX-8||y<30||y>WPY-6)return true;
  for(const r of COLL)if(x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h)return true;
  const tx=Math.floor(x/16),ty=Math.floor(y/16);if(isWaterTile(tx,ty))return true;
  if(S.scene==='town'&&J.on&&!npcIgnore&&((x-J.x)/7)**2+((y-J.y-1)/6)**2<1)return true;   // Juno zelf
  const d=S.scene==='farm'&&S.debris[tx+','+ty];if(d&&d.k!=='weed'&&d.k!=='twig'){const cx=tx*16+8,cy=ty*16+10;if(Math.abs(x-cx)<7&&Math.abs(y-cy)<5)return true;}
  return false;}
const blocked=(x,y)=>solidAt(x-5,y)||solidAt(x+5,y)||solidAt(x-5,y-3)||solidAt(x+5,y-3);
// Besturing: vrij lopen, maar altijd netjes eindigen midden op een tegel (net als in Zelda/Stardew).
// Kort tikken = precies één tegel; een korte tik in een andere richting = alleen draaien.
const SPEED=74,TC=[8,12];          // tegelmidden voor de voeten: x 16k+8, y 16k+12
const tileOf=(x,y)=>[Math.floor(x/16),Math.floor((y-2)/16)];
let startC=null,tapBuf=null,step=null,auto=null,turnUntil=0,wasMoving=false,lastV=[0,0],queuedUse=false,actHeld=false,repT=0;
function snapC(p,off,s){if(!s)return Math.round((p-off)/16)*16+off;const back=(s>0?Math.floor((p-off)/16):Math.ceil((p-off)/16))*16+off;return Math.abs(p-back)<4?back:back+16*s;}
function readInput(){let dx=0,dy=0;
  if(keys.has('arrowleft')||keys.has('a'))dx-=1;if(keys.has('arrowright')||keys.has('d'))dx+=1;if(keys.has('arrowup')||keys.has('w'))dy-=1;if(keys.has('arrowdown')||keys.has('s'))dy+=1;
  if(joy.x||joy.y)return {dx:joy.x,dy:joy.y,aim:joy.aim};
  if(gest&&gest.mode==='follow'){   // vinger vasthouden: loop naar je vinger toe
    const fx=gest.cx/SCALE+camX,fy=gest.cy/SCALE+camY,vx=fx-S.px,vy=fy-(S.py-8),d=Math.hypot(vx,vy);
    if(d<8)return {dx:0,dy:0,aim:false};let ux=vx/d,uy=vy/d;
    if(Math.abs(ux)<Math.abs(uy)*.45)ux=0;else if(Math.abs(uy)<Math.abs(ux)*.45)uy=0;const l=Math.hypot(ux,uy);
    return {dx:ux/l,dy:uy/l,aim:false};}
  return {dx,dy,aim:false};}
// één stukje bewegen met botsingen
function moveBy(mx,my){const nx=S.px+mx,ny=S.py+my;
  if(S.scene==='farm'&&my<0&&nx>DOOR.x0&&nx<DOOR.x1&&ny<DOOR.y+4&&S.py>=DOOR.y){enterHouse();return 'door';}
  if(S.scene==='town'&&my<0&&nx>SDOOR.x0&&nx<SDOOR.x1&&ny<SDOOR.y+4&&S.py>=SDOOR.y&&enterShop())return 'door';
  if(isRoom()){const RM=ROOMS[S.scene];if(ny>RM.h-2&&nx>RM.ex0&&nx<RM.ex1){if(S.scene==='house')leaveHouse();else leaveShop();return 'door';}}
  const ox=S.px,oy=S.py;
  if(mx&&!blocked(nx,S.py))S.px=nx;
  if(my&&!blocked(S.px,ny))S.py=ny;
  if(S.scene==='farm'&&S.px>WPX-24){goTown();return 'door';}
  if(S.scene==='town'&&S.px<24){goFarm();return 'door';}
  if(S.scene==='town'&&S.px>WPX-24){S.px=WPX-26;toast('Het Doornwoud is nog dicht… dat komt in een volgende versie!');}
  return S.px!==ox||S.py!==oy;}
// houd je in de rij/kolom als je recht loopt
function laneAssist(axis,dt){const c=axis?snapC(S.py,TC[1],0):snapC(S.px,TC[0],0);const cur=axis?S.py:S.px,d=c-cur;if(Math.abs(d)<.01)return;
  const st=Math.sign(d)*Math.min(Math.abs(d),45*dt);if(axis){if(!blocked(S.px,S.py+st))S.py+=st;}else if(!blocked(S.px+st,S.py))S.px+=st;}
function dirOf(dx,dy){return Math.abs(dx)>Math.abs(dy)?(dx<0?1:2):(dy<0?3:0);}
function arrive(){player.anim=0;if(actHeld)repT=0;if(queuedUse){queuedUse=false;useTool();}}
function move(dt){player.moving=false;
  if(fading||player.swing>0){player.anim=0;return;}
  const {dx,dy,aim}=readInput();
  if(dx||dy){auto=null;tapBuf=null;if(!(gest&&gest.mode==='follow'))swipeQ.length=0;
    const nd=dirOf(dx,dy);
    if(!wasMoving&&!step&&nd!==S.dir){S.dir=nd;turnUntil=performance.now()+110;}   // eerst draaien, pas lopen als je de toets vasthoudt
    S.dir=nd;
    if(aim){player.anim=0;return;}
    if(performance.now()<turnUntil)return;
    if(!wasMoving)startC=step?{x:step.x,y:step.y}:{x:snapC(S.px,TC[0],0),y:snapC(S.py,TC[1],0)};
    step=null;wasMoving=true;lastV=[Math.sign(Math.round(dx*100)),Math.sign(Math.round(dy*100))];
    const l=Math.max(1,Math.hypot(dx,dy)),sp=SPEED*dt;
    if(moveBy(dx/l*sp,dy/l*sp)==='door'){wasMoving=false;return;}
    if(isOutdoor()){if(!lastV[1])laneAssist(1,dt);if(!lastV[0])laneAssist(0,dt);}
    player.moving=true;player.anim+=dt*8;return;}
  turnUntil=0;
  if(tapBuf&&isRoom())tapBuf=null;
  if(tapBuf&&!step&&!auto){const b=tapBuf;tapBuf=null;
    if(performance.now()-b.t<600){if(b.dir!==S.dir)S.dir=b.dir;else{const v=DIRV[b.dir];step={x:snapC(S.px,TC[0],0)+v[0]*16,y:snapC(S.py,TC[1],0)+v[1]*16,t:0};}}}
  if(wasMoving&&isRoom()){wasMoving=false;arrive();return;}   // binnen geen tegelrooster
  if(wasMoving){wasMoving=false;step={x:snapC(S.px,TC[0],lastV[0]),y:snapC(S.py,TC[1],lastV[1]),t:0};
    // een tik is altijd minstens één hele tegel
    if(startC&&step.x===startC.x&&step.y===startC.y){step.x+=lastV[0]*16;step.y+=lastV[1]*16;}}
  const tgt=step||(auto&&auto.path[0]);
  if(!tgt){player.anim=0;return;}
  const ex=tgt.x-S.px,ey=tgt.y-S.py,d=Math.hypot(ex,ey);
  if(d<.5){S.px=tgt.x;S.py=tgt.y;
    if(step){step=null;arrive();return;}
    auto.path.shift();
    if(!auto.path.length){const a=auto;auto=null;player.anim=0;if(a.face!=null)S.dir=a.face;if(!a.noUse)useToolAt(a.tx,a.ty);if(a.then)a.then();}
    return;}
  if(auto)S.dir=dirOf(ex,ey);
  const o=step||auto;o.age=(o.age||0)+dt;
  const k=Math.min(1,SPEED*dt/d);const r=moveBy(ex*k,ey*k);
  if(r==='door'){step=null;auto=null;return;}
  // vast? Kijk naar echte voortgang (niet alleen 'een heel klein beetje bewogen'), anders blijf je eeuwig 'bezig'
  const nd=Math.hypot(tgt.x-S.px,tgt.y-S.py);
  if(d-nd<Math.min(d,SPEED*dt)*.3)o.t=(o.t||0)+dt;else o.t=0;
  if(o.t>.15||(step&&o.age>1)){if(auto&&!auto.noUse)toast('Daar kun je niet bij');auto=null;
    // eerst terug naar het midden van je eigen tegel; lukt ook dat niet, dan gewoon stoppen waar je bent
    const [bx,by]=tileOf(S.px,S.py),back={x:bx*16+TC[0],y:by*16+TC[1],t:0,back:1};
    if(step&&!step.back&&Math.hypot(back.x-S.px,back.y-S.py)>.5){step=back;return;}
    step=null;arrive();return;}   // een wachtende Doe/Spatie gaat wel door
  player.moving=true;player.anim+=dt*8;}
// Tik/klik op een tegel verderop: loop er (om obstakels heen) naartoe en gebruik dan je gereedschap
function walkable(tx,ty){const x=tx*16+TC[0],y=ty*16+TC[1];return tx>=0&&ty>=0&&tx<MW&&ty<MH&&!blocked(x,y)&&!blocked(x,y-5)&&!blocked(x,y+3);}
function goUse(tx,ty){if(dlgOpen||!isOutdoor())return;const [ptx,pty]=tileOf(S.px,S.py);
  if(Math.abs(tx-ptx)<=1&&Math.abs(ty-pty)<=1){S.dir=dirOf(tx-ptx,ty-pty);return useToolAt(tx,ty);}
  const goals=new Map([[tx+','+(ty+1),3],[(tx-1)+','+ty,2],[(tx+1)+','+ty,1],[tx+','+(ty-1),0]]);
  const a=pathTo(goals);if(!a)return toast('Daar kun je niet bij');step=null;auto={...a,tx,ty,t:0};}
// zoek een pad (over tegels) naar een van de doeltegels; geeft {path, face} terug
function pathTo(goals,start){const [ptx,pty]=start||tileOf(S.px,S.py);
  const prev=new Map([[ptx+','+pty,null]]);const q=[[ptx,pty]];let hit=null;
  while(q.length&&prev.size<900){const [x,y]=q.shift();const k=x+','+y;if(goals.has(k)&&walkable(x,y)){hit=k;break;}
    for(const[ax,ay]of DIRV){const nx=x+ax,ny=y+ay,nk=nx+','+ny;if(!prev.has(nk)&&walkable(nx,ny)){prev.set(nk,k);q.push([nx,ny]);}}}
  if(!hit)return null;
  const path=[];for(let k=hit;k;k=prev.get(k)){const [x,y]=k.split(',').map(Number);path.unshift({x:x*16+TC[0],y:y*16+TC[1]});}
  return {path,face:goals.get(hit)};}
function walkTo(tx,ty){if(dlgOpen||!isOutdoor())return false;const a=pathTo(new Map([[tx+','+ty,null]]));if(!a)return false;step=null;auto={...a,tx,ty,t:0,noUse:1};return true;}
// alle invoer loslaten (bij dialogen, overgangen en slapen), zodat je niet vanzelf doorloopt
// soft (bij een deur): ingedrukte toetsen en de joystick blijven gelden, alleen half afgemaakte stappen vervallen
function resetInput(soft){if(!soft){keys.clear();joyReset();actHeld=false;gest=null;swipeQ.length=0;}step=null;auto=null;wasMoving=false;tapBuf=null;queuedUse=false;turnUntil=0;player.moving=false;player.anim=0;}
// naast het bed (onder of links ervan) mag je gaan slapen
const nearBed=()=>S.scene==="house"&&S.px>100&&S.py<104;
function enterHouse(){fade(()=>{S.scene='house';S.px=80;S.py=ROOM.h-8;S.dir=3;});}
function leaveHouse(){fade(()=>{S.scene="farm";setWorld('farm');S.px=120;S.py=140;S.dir=0;});}
// Naar het dorp en terug (over het pad aan de oostkant van de boerderij)
function goTown(){fade(()=>{S.scene='town';setWorld('town');S.px=40;S.py=220;S.dir=2;camX=0;camY=Math.max(0,220-12-VH/2);});setTimeout(()=>toast('🏡 Mossbrook'),450);}
function goFarm(){fade(()=>{S.scene='farm';setWorld('farm');S.px=WPX-40;S.py=316;S.dir=1;});}
const shopOpen=()=>S.time>=480&&S.time<1080;
function enterShop(){if(!shopOpen()){toast("Pip's Zaden is open van 08:00 tot 18:00");return false;}
  fade(()=>{S.scene='shop';S.px=88;S.py=SHOPROOM.h-8;S.dir=3;});
  if(S.pipHi!==S.day){S.pipHi=S.day;setTimeout(()=>toast(TOUCH?"Pip: Hoi! Welkom bij Pip's Zaden. Tik op mij om zaadjes te kopen.":"Pip: Hoi! Welkom bij Pip's Zaden. Druk op E bij de toonbank."),500);}
  return true;}
function leaveShop(){fade(()=>{S.scene='town';setWorld('town');S.px=264;S.py=156;S.dir=0;});}
const nearCounter=()=>S.scene==='shop'&&S.py<100&&S.px>30&&S.px<146;
function facingTile(){if(auto&&!auto.noUse)return [auto.tx,auto.ty];const [tx,ty]=step?tileOf(step.x,step.y):tileOf(S.px,S.py);const v=DIRV[S.dir];return [tx+v[0],ty+v[1]];}

/* ---------------- gereedschap ---------------- */
const TOOLS=['hand','hoe','can','seed','axe'];
const TOOLNAME={hand:'Hand',hoe:'Schoffel',can:'Gieter',seed:'Zaadjes',axe:'Bijl'};
const COST={hoe:2,can:1,axe:2};
let pending=null;
function cycleSeed(){const have=CROP_IDS.filter(id=>S.seeds[id]>0);if(!have.length){toast('Je hebt geen zaadjes meer');return;}const i=have.indexOf(S.seedSel);S.seedSel=have[(i+1)%have.length];toast(`Zaadjes: ${CROPS[S.seedSel].name} (${S.seeds[S.seedSel]})`);}
function useTool(){if(dlgOpen||player.swing>0)return;
  if(S.scene==='house'){step=null;if(nearBed())return askSleep();toast('Loop naar je bed om te slapen, of naar de deur om naar buiten te gaan');return;}
  if(S.scene==='shop'){step=null;if(nearCounter())return openShop();toast('Loop naar de toonbank om zaadjes te kopen');return;}
  if(junoNear()&&!step&&!auto){const [fx,fy]=facingTile();if(Math.hypot(fx*16+8-J.x,fy*16+12-J.y)<20||Math.hypot(S.px-J.x,S.py-J.y)<20)return talkJuno();}
  if(step||auto){queuedUse=true;return;}   // eerst netjes op de tegel uitlopen
  const [tx,ty]=facingTile();useToolAt(tx,ty);}
function tire(n){if(!n)return true;if(S.energy<n){toast('Je bent te moe. Ga slapen in je huisje 🛏️');return false;}S.energy=Math.max(0,S.energy-n);return true;}
function useToolAt(tx,ty){if(player.swing>0||!isOutdoor())return;const tool=TOOLS[S.tool],k=tx+','+ty;
  player.swing=.28;pending={tool,tx,ty};}
function applyTool(){const {tool,tx,ty}=pending;pending=null;const k=tx+','+ty;const tile=S.tiles[k],deb=S.debris[k];
  if(S.scene==='town'){   // in het dorp: knikker oprapen, bloembakken water geven, gieter vullen in de beek
    if(tool==='hand'&&marbleVisible()&&tx===MARBLE[0]&&ty===MARBLE[1]){S.items.marble=1;pop(tx,ty,'#7ad0f0');sfx('pick');toast('🔮 Je vond Juno\'s geluksknikker!');save();return;}
    const bi=BEDS.findIndex(b=>b[0]===tx&&b[1]===ty);
    if(bi>=0&&bedsActive()){if(tool!=='can')return toast('Geef de bloembak water met je gieter');if(S.beds[bi])return toast('Deze bloembak heeft al water');if(S.water<=0)return toast('De gieter is leeg. Vul hem in de beek');
      if(!tire(COST.can))return;S.water--;S.beds[bi]=1;pop(tx,ty,WA[4]);sfx('splash');toast(`🌸 Bloembak ${S.beds.filter(Boolean).length}/3`);save();return;}
    if(tool==='can'&&isWaterTile(tx,ty)){S.water=12;toast('Gieter vol! 💧');sfx('splash');return;}
    return;}
  // verzendkist
